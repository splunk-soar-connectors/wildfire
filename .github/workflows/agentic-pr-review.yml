name: Reusable Push + Agentic PR Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Development fallback: lets this unmerged workflow run from a branch and
  # resolve the open PR for that branch. Remove before merging to production
  # if you only want pull_request_target runs.
  push:
    branches-ignore:
      - main

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: reusable-push-agentic-pr-review-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.pr.outputs.found }}
      repo: ${{ steps.pr.outputs.repo }}
      repo_name: ${{ steps.pr.outputs.repo_name }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      is_draft: ${{ steps.pr.outputs.is_draft }}
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr = context.payload.pull_request;

            if (!pr && context.eventName === "push") {
              const head = `${owner}:${process.env.GITHUB_REF_NAME}`;
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                head,
                state: "open",
                per_page: 10,
              });
              pr = prs.find((candidate) => candidate.head.sha === context.sha) || prs[0];
            }

            if (!pr) {
              core.notice(`No open PR found for ${owner}/${repo} branch ${process.env.GITHUB_REF_NAME}`);
              core.setOutput("found", "false");
              core.setOutput("repo", `${owner}/${repo}`);
              core.setOutput("repo_name", repo);
              core.setOutput("pr_number", "0");
              core.setOutput("head_repo", `${owner}/${repo}`);
              core.setOutput("head_ref", process.env.GITHUB_REF_NAME || "");
              core.setOutput("head_sha", context.sha);
              core.setOutput("base_ref", "");
              core.setOutput("base_sha", "");
              core.setOutput("is_draft", "true");
              return;
            }

            core.setOutput("found", "true");
            core.setOutput("repo", `${owner}/${repo}`);
            core.setOutput("repo_name", repo);
            core.setOutput("pr_number", String(pr.number));
            core.setOutput("head_repo", pr.head.repo.full_name);
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("base_ref", pr.base.ref);
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("is_draft", String(pr.draft));

  pr-labeling:
    runs-on: ubuntu-latest
    needs: resolve-pr
    if: ${{ needs.resolve-pr.outputs.found == 'true' && github.event_name == 'pull_request_target' && github.event.action == 'opened' }}
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Assign PR Labels
        uses: splunk-soar-connectors/.github/.github/actions/pr-labeling@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          jira-user: ${{ secrets.JIRA_USER }}
          jira-api-key: ${{ secrets.JIRA_API_KEY }}
          repo-name: ${{ needs.resolve-pr.outputs.repo }}
          pr-number: ${{ needs.resolve-pr.outputs.pr_number }}

  detect-app-type:
    runs-on: ubuntu-latest
    needs: resolve-pr
    if: ${{ needs.resolve-pr.outputs.found == 'true' }}
    outputs:
      is_sdkfied: ${{ steps.detect.outputs.is_sdkfied }}
      uv_lock_directory: ${{ steps.detect.outputs.uv_lock_directory }}
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Detect App Type
        id: detect
        run: |
          echo "Detecting app type..."

          # Find uv.lock file and get its parent directory
          UV_LOCK_PATH=$(find . -name "uv.lock" -type f | head -1)

          if [ -n "$UV_LOCK_PATH" ]; then
            UV_LOCK_DIR=$(dirname "$UV_LOCK_PATH")
            echo "Found uv.lock in directory: $UV_LOCK_DIR"
            echo "This is an SDKfied app"
            echo "is_sdkfied=true" >> $GITHUB_OUTPUT
            echo "uv_lock_directory=$UV_LOCK_DIR" >> $GITHUB_OUTPUT
          else
            echo "No uv.lock found"
            echo "This is a traditional app"
            echo "is_sdkfied=false" >> $GITHUB_OUTPUT
            echo "uv_lock_directory=" >> $GITHUB_OUTPUT
          fi

          echo "App detection completed"
        shell: bash

  pytest:
    runs-on: ubuntu-latest
    needs: [resolve-pr, detect-app-type]
    if: ${{ needs.resolve-pr.outputs.found == 'true' && needs.detect-app-type.outputs.is_sdkfied == 'true' }}
    permissions:
      contents: read
    env:
      UV_LOCK_DIRECTORY: ${{ needs.detect-app-type.outputs.uv_lock_directory }}
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Set up SDKfied app environment
        uses: splunk-soar-connectors/.github/.github/actions/sdkfied-app-setup@main
        with:
          uv_lock_directory: ${{ env.UV_LOCK_DIRECTORY }}

      - name: Run pytest
        run: uv run --project "$UV_LOCK_DIRECTORY" python -m pytest

  pre-commit:
    runs-on: ubuntu-latest
    needs: resolve-pr
    if: ${{ needs.resolve-pr.outputs.found == 'true' }}
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Setup Environment
        uses: splunk-soar-connectors/.github/.github/actions/env-setup@main

      - name: Pre-commit
        uses: splunk-soar-connectors/.github/.github/actions/pre-commit@main

  semantic-release-preview:
    runs-on: ubuntu-latest
    needs: resolve-pr
    if: ${{ needs.resolve-pr.outputs.found == 'true' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out shared workflow files
        uses: actions/checkout@v4
        with:
          repository: splunk-soar-connectors/.github
          ref: main
          path: dotgithub

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install semantic-release dependencies
        run: npm install --global semantic-release @semantic-release/exec @semantic-release/git conventional-changelog-conventionalcommits

      - name: Prepare release configuration
        run: |
          cp dotgithub/.releaserc.json .releaserc.json

      - name: Run Semantic Release as a dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ needs.resolve-pr.outputs.head_ref }}
        run: |
          unset GITHUB_ACTIONS GITHUB_REF GITHUB_EVENT_NAME
          semantic-release --dry-run --no-ci --branches "$PR_HEAD_REF" --tag-format '${version}'

      - name: Comment release notes on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ needs.resolve-pr.outputs.repo }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: |
          breadcrumb='<!-- semantic-release-breadcrumb -->'
          message='Merging this PR will not result in a release.'

          if [[ -s release_version.txt ]]; then
            version_number=$(<release_version.txt)
            release_notes=$(<release_notes.txt)
            printf -v message 'Merging this PR will release `%s` with the following release notes:\n\n%s' "$version_number" "$release_notes"

            if [[ -s release_notes/unreleased.md ]]; then
              connector_changes=$(sed '/^\*\*Unreleased\*\*$/d' release_notes/unreleased.md)
              printf -v message '%s\n\n### Connector release changes\n\n%s' "$message" "$connector_changes"
            fi
          fi

          printf -v comment_body '%s\n%s' "$breadcrumb" "$message"
          comment_id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.body | startswith("<!-- semantic-release-breadcrumb -->")) | .id' \
            | head -1)

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$comment_body"
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$comment_body"
          fi

  compile:
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:f7150dbb7f347d35f8f4bb285d36985ecd4cf231
    needs: [resolve-pr, detect-app-type]
    if: ${{ needs.resolve-pr.outputs.found == 'true' }}
    env:
      IS_SDKFIED: ${{ needs.detect-app-type.outputs.is_sdkfied }}
      UV_LOCK_DIRECTORY: ${{ needs.detect-app-type.outputs.uv_lock_directory }}
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Setup SDKfied App Environment
        if: env.IS_SDKFIED == 'true'
        uses: splunk-soar-connectors/.github/.github/actions/sdkfied-app-setup@main
        with:
          uv_lock_directory: ${{ env.UV_LOCK_DIRECTORY }}

      - name: Compile Application
        uses: splunk-soar-connectors/.github/.github/actions/compile-app@main
        with:
          current_phantom_ip: ${{ vars.PHANTOM_INSTANCE_CURRENT_VERSION_IP }}
          next_phantom_ip: ${{ vars.PHANTOM_INSTANCE_NEXT_OL8_VERSION_IP }}
          previous_phantom_ip: ${{ vars.PHANTOM_INSTANCE_PREVIOUS_VERSION_IP }}
          phantom_username: ${{ vars.PHANTOM_USERNAME }}
          phantom_password: password
          is_sdkfied: ${{ needs.detect-app-type.outputs.is_sdkfied }}
          uv_lock_directory: ${{ needs.detect-app-type.outputs.uv_lock_directory }}

  build:
    # connector-template intentionally uses a sentinel app ID and is not a publishable app.
    if: ${{ needs.resolve-pr.outputs.found == 'true' && needs.resolve-pr.outputs.repo_name != 'connector-template' }}
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:f7150dbb7f347d35f8f4bb285d36985ecd4cf231
    needs: [resolve-pr, compile, detect-app-type]
    env:
      IS_SDKFIED: ${{ needs.detect-app-type.outputs.is_sdkfied }}
      UV_LOCK_DIRECTORY: ${{ needs.detect-app-type.outputs.uv_lock_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Build Application
        if: env.IS_SDKFIED == 'false'
        uses: splunk-soar-connectors/.github/.github/actions/build-app@main

      - name: Setup SDKfied App Environment
        if: env.IS_SDKFIED == 'true'
        uses: splunk-soar-connectors/.github/.github/actions/sdkfied-app-setup@main
        with:
          uv_lock_directory: ${{ env.UV_LOCK_DIRECTORY }}

      - name: Build SDK app
        if: env.IS_SDKFIED == 'true'
        run: |
          cd "${{ env.UV_LOCK_DIRECTORY }}"
          echo "Building SDKfied app using soarapps CLI"
          uv run soarapps package build . --output-file /tmp/${{ needs.resolve-pr.outputs.repo_name }}.tgz
          echo "SDKfied app build completed successfully"

      - name: Upload app tar file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-tar
          path: /tmp/${{ needs.resolve-pr.outputs.repo_name }}.tgz

  test-setup:
    runs-on: ubuntu-latest
    needs: [resolve-pr, build, detect-app-type]
    if: ${{ needs.resolve-pr.outputs.found == 'true' }}
    env:
      IS_SDKFIED: ${{ needs.detect-app-type.outputs.is_sdkfied }}
      UV_LOCK_DIRECTORY: ${{ needs.detect-app-type.outputs.uv_lock_directory }}
    outputs:
      fips_compliant: ${{ steps.set-outputs.outputs.fips_compliant }}
      publisher: ${{ steps.set-outputs.outputs.publisher }}
    steps:
      - name: Check out actions repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Setup Python 3.13 for SDKfied apps
        if: env.IS_SDKFIED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup SDKfied App Environment
        if: env.IS_SDKFIED == 'true'
        uses: splunk-soar-connectors/.github/.github/actions/sdkfied-app-setup@main
        with:
          uv_lock_directory: ${{ env.UV_LOCK_DIRECTORY }}

      - name: Create temporary manifest for SDKfied app
        if: env.IS_SDKFIED == 'true'
        run: |
          uv run --project "${{ env.UV_LOCK_DIRECTORY }}" soarapps manifests create temp_app.json "${{ env.UV_LOCK_DIRECTORY }}"
          echo "Created temporary manifest: temp_app.json"
        shell: bash

      - name: Set sanity tests environment variables
        uses: splunk-soar-connectors/.github/.github/actions/test-setup@main

      - name: Clean up temporary manifest for SDKfied app
        if: env.IS_SDKFIED == 'true'
        run: |
          rm -f temp_app.json
          echo "Deleted temporary manifest: temp_app.json"
        shell: bash

      - name: Set outputs
        id: set-outputs
        run: |
          echo "${{ env.publisher }}"
          echo publisher="${{ env.publisher }}" >> $GITHUB_OUTPUT
          echo "fips_compliant=${{ env.fips_compliant }}" >> $GITHUB_OUTPUT

  test-coverage:
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:f7150dbb7f347d35f8f4bb285d36985ecd4cf231
    needs: [resolve-pr, test-setup, detect-app-type]
    env:
      IS_SDKFIED: ${{ needs.detect-app-type.outputs.is_sdkfied }}
      UV_LOCK_DIRECTORY: ${{ needs.detect-app-type.outputs.uv_lock_directory }}
    if: ${{ needs.resolve-pr.outputs.found == 'true' && needs.test-setup.outputs.publisher == 'Splunk' }}
    continue-on-error: true
    steps:
      - name: Check out actions repo
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Setup SDKfied App Environment
        if: env.IS_SDKFIED == 'true'
        uses: splunk-soar-connectors/.github/.github/actions/sdkfied-app-setup@main
        with:
          uv_lock_directory: ${{ env.UV_LOCK_DIRECTORY }}

      - name: Create temporary manifest for SDKfied app
        if: env.IS_SDKFIED == 'true'
        run: |
          uv run --project "${{ env.UV_LOCK_DIRECTORY }}" soarapps manifests create temp_app.json "${{ env.UV_LOCK_DIRECTORY }}"
          echo "Created temporary manifest: temp_app.json"
        shell: bash

      - name: Run Test Coverage
        uses: splunk-soar-connectors/.github/.github/actions/test-coverage@main
        with:
          app_repo: ${{ needs.resolve-pr.outputs.repo_name }}

      - name: Clean up temporary manifest for SDKfied app
        if: env.IS_SDKFIED == 'true'
        run: |
          rm -f temp_app.json
          echo "Deleted temporary manifest: temp_app.json"
        shell: bash

  sanity-test:
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:f7150dbb7f347d35f8f4bb285d36985ecd4cf231
    needs: [resolve-pr, test-setup]
    if: ${{ needs.resolve-pr.outputs.found == 'true' && needs.test-setup.outputs.publisher == 'Splunk' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "next_ol8"
            ip: ${{ vars.PHANTOM_INSTANCE_NEXT_OL8_VERSION_IP }}
          - version: "next_ol9"
            ip: ${{ vars.PHANTOM_INSTANCE_NEXT_OL9_VERSION_IP }}
          - version: "next_amzn2023"
            ip: ${{ vars.PHANTOM_INSTANCE_NEXT_AMZN2023_VERSION_IP }}
          - version: "previous"
            ip: ${{ vars.PHANTOM_INSTANCE_PREVIOUS_VERSION_IP }}
          - version: "cloud"
            ip: ${{ vars.PHANTOM_INSTANCE_CLOUD_HOST }}
          - version: "cloud_next"
            ip: ${{ vars.PHANTOM_INSTANCE_CLOUD_NEXT_HOST }}
    env:
      NUM_TEST_RETRIES: ${{ vars.NUM_TEST_RETRIES }}
      VAULT_ROLE: ${{ vars.VAULT_ROLE }}
      PHANTOM_INSTANCE_CURRENT_FIPS_VERSION_IP: ${{ vars.PHANTOM_INSTANCE_CURRENT_FIPS_VERSION_IP }}
      PLAYBOOK_EXCLUDE_REGEX: ${{ vars.PLAYBOOK_EXCLUDE_REGEX }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Download app tar file
        uses: actions/download-artifact@v4
        with:
          name: app-tar

      - name: Check version compatibility
        id: version-check
        uses: splunk-soar-connectors/.github/.github/actions/version-check@main
        with:
          tarball_name: ${{ needs.resolve-pr.outputs.repo_name }}.tgz
          phantom_ip: ${{ matrix.ip }}

      - name: Run Sanity Tests
        if: steps.version-check.outputs.compatible == 'true'
        uses: splunk-soar-connectors/.github/.github/actions/sanity-tests@main
        with:
          phantom_ip: ${{ matrix.ip }}
          version: ${{ matrix.version }}
          app_repo: ${{ needs.resolve-pr.outputs.repo_name }}
          automation_broker: ${{ vars.AUTOMATION_BROKER_NAME }}
          automation_broker_next: ${{ vars.AUTOMATION_BROKER_NEXT_NAME }}

      - name: Upload Sanity Test Results
        uses: actions/upload-artifact@v4
        if: always() && steps.version-check.outputs.compatible == 'true'
        with:
          name: sanity-test-results-${{ matrix.version }}
          path: ${{ github.workspace }}/test-results/
          retention-days: 1

  aws-sanity-test:
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:f7150dbb7f347d35f8f4bb285d36985ecd4cf231
    needs: [resolve-pr, test-setup]
    if: ${{ needs.resolve-pr.outputs.found == 'true' && needs.test-setup.outputs.publisher == 'Splunk' && contains(needs.resolve-pr.outputs.repo_name, 'aws') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "aws_current"
          - version: "aws_previous"
          - version: "aws_next"
    env:
      AWS_PHANTOM_INSTANCE_CURRENT_VERSION_IP: ${{ secrets.AWS_PHANTOM_INSTANCE_CURRENT_VERSION_IP }}
      AWS_PHANTOM_INSTANCE_PREVIOUS_VERSION_IP: ${{ secrets.AWS_PHANTOM_INSTANCE_PREVIOUS_VERSION_IP }}
      AWS_PHANTOM_INSTANCE_NEXT_VERSION_IP: ${{ secrets.AWS_PHANTOM_INSTANCE_NEXT_VERSION_IP }}
      AWS_PHANTOM_USERNAME: ${{ vars.AWS_PHANTOM_USERNAME }}
      AWS_PHANTOM_PASSWORD: ${{ secrets.AWS_PHANTOM_PASSWORD }}
      NUM_TEST_RETRIES: ${{ vars.NUM_TEST_RETRIES }}
      VAULT_ROLE: ${{ vars.VAULT_ROLE }}

    steps:
      - name: Resolve AWS Phantom IP
        id: resolve-ip
        shell: bash
        run: |
          case "${{ matrix.version }}" in
            aws_current)  ip="$AWS_PHANTOM_INSTANCE_CURRENT_VERSION_IP" ;;
            aws_previous) ip="$AWS_PHANTOM_INSTANCE_PREVIOUS_VERSION_IP" ;;
            aws_next)     ip="$AWS_PHANTOM_INSTANCE_NEXT_VERSION_IP" ;;
          esac
          if [[ -z "$ip" ]]; then
            echo "::error::AWS Phantom instance IP is not set for version '${{ matrix.version }}'. Set the corresponding repository secret."
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "AWS_PHANTOM_URL=https://$ip" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Download app tar file
        uses: actions/download-artifact@v4
        with:
          name: app-tar

      - name: Run Sanity Tests
        uses: splunk-soar-connectors/.github/.github/actions/sanity-tests@main
        with:
          phantom_ip: ${{ steps.resolve-ip.outputs.ip }}
          version: ${{ matrix.version }}
          app_repo: ${{ needs.resolve-pr.outputs.repo_name }}

      - name: Upload Sanity Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-test-results-${{ matrix.version }}
          path: ${{ github.workspace }}/test-results/
          retention-days: 1

  aggregate-sanity-results:
    runs-on: ubuntu-latest
    needs: [resolve-pr, sanity-test, aws-sanity-test, test-setup]
    if: always() && needs.resolve-pr.outputs.found == 'true' && needs.test-setup.outputs.publisher == 'Splunk'
    steps:
      - name: Download All Sanity Test Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sanity-test-results-*
          path: downloaded-artifacts/
          merge-multiple: false

      - name: Aggregate Test Results
        uses: splunk-soar-connectors/.github/.github/actions/aggregate-sanity-results@main
        with:
          artifacts_path: downloaded-artifacts

  integration-test:
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:f7150dbb7f347d35f8f4bb285d36985ecd4cf231
    needs: [resolve-pr, test-setup]
    if: ${{ needs.resolve-pr.outputs.found == 'true' && needs.test-setup.outputs.publisher == 'Splunk' }}
    env:
      PHANTOM_INSTANCE_IP: ${{ vars.PHANTOM_INSTANCE_CURRENT_VERSION_IP }}
      PHANTOM_INSTANCE_IP_FIPS: ${{ vars.PHANTOM_INSTANCE_CURRENT_FIPS_VERSION_IP }}
      NUM_TEST_RETRIES: ${{ vars.NUM_TEST_RETRIES }}
      VAULT_ROLE: ${{ vars.VAULT_ROLE }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Download app tar file
        uses: actions/download-artifact@v4
        with:
          name: app-tar

      - name: Run Integration Tests
        uses: splunk-soar-connectors/.github/.github/actions/integration-tests@main
        with:
          fips_compliant: ${{ needs.test-setup.outputs.fips_compliant }}
          app_repo: ${{ needs.resolve-pr.outputs.repo_name }}

  agentic-pr-review:
    name: Agentic PR review
    needs:
      - resolve-pr
      - pr-labeling
      - detect-app-type
      - pytest
      - pre-commit
      - semantic-release-preview
      - compile
      - build
      - test-setup
      - test-coverage
      - sanity-test
      - aws-sanity-test
      - aggregate-sanity-results
      - integration-test
    if: always() && needs.resolve-pr.outputs.found == 'true' && needs.resolve-pr.outputs.is_draft == 'false'
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      issues: read
    uses: splunk-soar-connectors/AgenticPRReview/.github/workflows/pr-review.yml@sanchaga/agenticprreviewbot
    with:
      repo: ${{ needs.resolve-pr.outputs.repo }}
      pr_number: ${{ fromJSON(needs.resolve-pr.outputs.pr_number) }}
      circuit_base_url: ${{ vars.CIRCUIT_BASE_URL }}
      circuit_model: ${{ vars.CIRCUIT_MODEL }}
      circuit_token_url: ${{ vars.CIRCUIT_TOKEN_URL }}
      previous_pipeline_results_json: >-
        {"jobs":{"pre-commit":{"result":"${{ needs['pre-commit'].result }}","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"},"compile":{"result":"${{ needs.compile.result }}","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"},"build":{"result":"${{ needs.build.result }}","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"},"semantic-release-preview":{"result":"${{ needs['semantic-release-preview'].result }}","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}}
      publish_comments: true
    secrets:
      AI_REVIEW_APP_ID: ${{ secrets.AI_REVIEW_APP_ID }}
      AI_REVIEW_INSTALLATION_ID: ${{ secrets.AI_REVIEW_INSTALLATION_ID }}
      AI_REVIEW_PRIVATE_KEY: ${{ secrets.AI_REVIEW_PRIVATE_KEY }}
      CIRCUIT_CLIENT_ID: ${{ secrets.CIRCUIT_CLIENT_ID }}
      CIRCUIT_CLIENT_SECRET: ${{ secrets.CIRCUIT_CLIENT_SECRET }}
      CIRCUIT_APP_KEY: ${{ secrets.CIRCUIT_APP_KEY }}
